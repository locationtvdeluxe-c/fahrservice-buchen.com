<!-- BEWERBUNG SECTION -->
  <section class="section" id="bewerbung">
    <div class="container">
      <div class="section-label">Karriere / Verstärkung</div>
      <h2 class="section-title">Fahrer in Bad Dürkheim werden</h2>
      <p class="section-sub">Du möchtest als Chauffeur oder Taxifahrer in Bad Dürkheim arbeiten? Bewirb dich direkt über unser Online-Formular.</p>

      <div class="form-container">
        <form action="https://formspree.io/f/mzepjpny" method="POST">
          <!-- Weiterleitung nach dem Absenden direkt auf deine Jobseite -->
          <input type="hidden" name="_next" value="https://fahrservice-buchen.com/taxifahrer">

          <div class="form-group">
            <label for="vorname">Vorname *</label>
            <input type="text" id="vorname" name="Vorname" required>
          </div>
          <div class="form-group">
            <label for="nachname">Nachname *</label>
            <input type="text" id="nachname" name="Nachname" required>
          </div>
          <div class="form-group">
            <label for="email">E-Mail-Adresse *</label>
            <input type="email" id="email" name="E-Mail" required>
          </div>
          <div class="form-group">
            <label for="telefon">Telefonnummer *</label>
            <input type="tel" id="telefon" name="Telefon" required>
          </div>
          <div class="form-group">
            <label for="wohnort">Wohnort / PLZ *</label>
            <input type="text" id="wohnort" name="Wohnort" placeholder="z. B. 67098 Bad Dürkheim" required>
          </div>

          <div class="form-group">
            <label>Anstellungsverhältnis *</label>
            <div class="radio-group">
              <label><input type="radio" name="Anstellung" value="Vollzeit" required> Vollzeit</label>
              <label><input type="radio" name="Anstellung" value="Teilzeit"> Teilzeit</label>
              <label><input type="radio" name="Anstellung" value="Minijob"> Minijob / Aushilfe</label>
              <label><input type="radio" name="Anstellung" value="Saisonkraft"> Saisonkraft (z. B. Wurstmarkt)</label>
            </div>
          </div>

          <div class="form-group">
            <label>Personenbeförderungsschein (P-Schein) vorhanden? *</label>
            <div class="radio-group">
              <label><input type="radio" name="P_Schein" value="Ja, vorhanden" required> Ja, vorhanden</label>
              <label><input type="radio" name="P_Schein" value="Nein, bereit zur Beantragung"> Nein, aber Bereitschaft vorhanden</label>
            </div>
          </div>

          <div class="form-group">
            <label for="nachricht">Nachricht / Anmerkungen (optional)</label>
            <textarea id="nachricht" name="Nachricht" rows="3"></textarea>
          </div>

          <button type="submit" class="btn btn-primary" style="width:100%; justify-content:center;">Bewerbung absenden</button>
        </form>

        <div style="text-align: center; margin-top: 20px;">
          <a href="/taxifahrer" style="font-size: 14px; font-weight: 500; text-decoration: underline;">Mehr Informationen auf unserer Karriereseite /taxifahrer</a>
        </div>
      </div>
    </div>
  </section>
